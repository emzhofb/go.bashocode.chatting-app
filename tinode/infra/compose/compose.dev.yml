services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?POSTGRES_SUPERUSER is required}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      POSTGRES_DB: postgres
      POSTGRES_TINODE_USER: ${POSTGRES_TINODE_USER:?POSTGRES_TINODE_USER is required}
      POSTGRES_TINODE_PASSWORD: ${POSTGRES_TINODE_PASSWORD:?POSTGRES_TINODE_PASSWORD is required}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - private

  tinode:
    image: ${TINODE_IMAGE:-tinode/tinode:0.25.3}
    platform: ${TINODE_PLATFORM:-linux/amd64}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      app-api:
        condition: service_healthy
    environment:
      STORE_USE_ADAPTER: postgres
      POSTGRES_DSN: ${TINODE_POSTGRES_DSN:?TINODE_POSTGRES_DSN is required}
      WAIT_FOR: postgres:5432
      SAMPLE_DATA: ""
      RESET_DB: ${TINODE_RESET_DB:-false}
      UPGRADE_DB: ${TINODE_UPGRADE_DB:-false}
      API_KEY_SALT: ${TINODE_API_KEY_SALT:?TINODE_API_KEY_SALT is required}
      AUTH_TOKEN_KEY: ${TINODE_AUTH_TOKEN_KEY:?TINODE_AUTH_TOKEN_KEY is required}
      UID_ENCRYPTION_KEY: ${TINODE_UID_ENCRYPTION_KEY:?TINODE_UID_ENCRYPTION_KEY is required}
      MEDIA_HANDLER: fs
      DEFAULT_COUNTRY_CODE: ID
      FS_CORS_ORIGINS: '["http://localhost:6060","http://localhost:3000"]'
      WEBRTC_ENABLED: ${TINODE_WEBRTC_ENABLED:-false}
      FCM_PUSH_ENABLED: ${TINODE_FCM_PUSH_ENABLED:-false}
      TNPG_PUSH_ENABLED: ${TINODE_TNPG_PUSH_ENABLED:-false}
      EXT_CONFIG: /opt/tinode/tinode.conf
    ports:
      - "6060:6060"
    volumes:
      - tinode_media:/opt/tinode/uploads
      - ../tinode/tinode.conf.example:/opt/tinode/tinode.conf:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "6060"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    networks:
      - private

  app-api:
    build:
      context: ../../services/app-api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_HTTP_ADDR: :8080
      APP_INTERNAL_HTTP_ADDR: :8081
      APP_DATABASE_URL: postgresql://app_chat:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/app_chat?sslmode=disable&connect_timeout=10
      APP_PUBLIC_BASE_URL: http://localhost:8080
      APP_ALLOWED_ORIGINS: http://localhost:3000
      APP_BCRYPT_COST: ${APP_BCRYPT_COST:-12}
      APP_ACCESS_TOKEN_TTL: ${APP_ACCESS_TOKEN_TTL:-15m}
      APP_REFRESH_TOKEN_TTL: ${APP_REFRESH_TOKEN_TTL:-720h}
      APP_READINESS_TIMEOUT: ${APP_READINESS_TIMEOUT:-3s}
      APP_SHUTDOWN_TIMEOUT: ${APP_SHUTDOWN_TIMEOUT:-10s}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-debug}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12
    networks:
      - private

networks:
  private:
    driver: bridge

volumes:
  postgres_data:
  tinode_media:
