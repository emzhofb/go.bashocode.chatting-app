name: ${COMPOSE_PROJECT_NAME:-openim-chat-poc}

services:
  mongo:
    image: ${MONGO_IMAGE:?MONGO_IMAGE is required}
    restart: unless-stopped
    command: >-
      bash -ec '
      docker-entrypoint.sh mongod --wiredTigerCacheSizeGB 1 --auth &
      pid=$$!;
      until mongosh --host 127.0.0.1 --username "$${MONGO_ROOT_USERNAME}"
      --password "$${MONGO_ROOT_PASSWORD}" --authenticationDatabase admin
      --eval "db.runCommand({ ping: 1 })" >/dev/null 2>&1; do sleep 1; done;
      mongosh --host 127.0.0.1 --username "$${MONGO_ROOT_USERNAME}"
      --password "$${MONGO_ROOT_PASSWORD}" --authenticationDatabase admin
      --eval "db = db.getSiblingDB(\"$${MONGO_DATABASE}\"); if (!db.getUser(\"$${MONGO_USERNAME}\")) { db.createUser({ user: \"$${MONGO_USERNAME}\", pwd: \"$${MONGO_PASSWORD}\", roles: [{ role: \"readWrite\", db: \"$${MONGO_DATABASE}\" }] }); }";
      wait $$pid'
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_DATABASE: ${MONGO_DATABASE:?MONGO_DATABASE is required}
      MONGO_USERNAME: ${MONGO_USERNAME:?MONGO_USERNAME is required}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:?MONGO_DATABASE is required}
      TZ: UTC
    volumes:
      - mongo_data:/data/db
      - mongo_logs:/var/log/mongodb
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --host 127.0.0.1 --username "$${MONGO_ROOT_USERNAME}"
          --password "$${MONGO_ROOT_PASSWORD}" --authenticationDatabase admin
          --quiet --eval "db.runCommand({ ping: 1 }).ok" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [openim]

  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE is required}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: UTC
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [openim]

  etcd:
    image: ${ETCD_IMAGE:?ETCD_IMAGE is required}
    restart: unless-stopped
    environment:
      ETCD_NAME: openim-etcd
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: openim-etcd=http://etcd:2380
      ETCD_INITIAL_CLUSTER_TOKEN: openim-local
      ETCD_INITIAL_CLUSTER_STATE: new
      ALLOW_NONE_AUTHENTICATION: "yes"
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD-SHELL", "etcdctl --endpoints=http://127.0.0.1:2379 endpoint health"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [openim]

  kafka:
    image: ${KAFKA_IMAGE:?KAFKA_IMAGE is required}
    restart: unless-stopped
    user: root
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 8
      ALLOW_PLAINTEXT_LISTENER: "yes"
      TZ: UTC
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks: [openim]

  minio:
    image: ${MINIO_IMAGE:?MINIO_IMAGE is required}
    restart: unless-stopped
    command: ["minio", "server", "/data", "--console-address", ":9090"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID:?MINIO_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY:?MINIO_SECRET_ACCESS_KEY is required}
      TZ: UTC
    ports:
      - "127.0.0.1:${MINIO_PORT:-10005}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-10004}:9090"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [openim]

  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_APP_DATABASE:?POSTGRES_APP_DATABASE is required}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [openim]

  app-api:
    build:
      context: ../../services/app-api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HTTP_ADDR: ${APP_HTTP_ADDR:-:8080}
      APP_DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL is required}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      APP_BCRYPT_COST: ${APP_BCRYPT_COST:-12}
      APP_ACCESS_TOKEN_TTL: ${APP_ACCESS_TOKEN_TTL:-15m}
      APP_REFRESH_TOKEN_TTL: ${APP_REFRESH_TOKEN_TTL:-720h}
      APP_READINESS_TIMEOUT: ${APP_READINESS_TIMEOUT:-3s}
      APP_SHUTDOWN_TIMEOUT: ${APP_SHUTDOWN_TIMEOUT:-10s}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
      OPENIM_API_URL: ${OPENIM_API_URL:?OPENIM_API_URL is required}
      OPENIM_PUBLIC_API_URL: ${OPENIM_PUBLIC_API_URL:?OPENIM_PUBLIC_API_URL is required}
      OPENIM_PUBLIC_WS_URL: ${OPENIM_PUBLIC_WS_URL:?OPENIM_PUBLIC_WS_URL is required}
      OPENIM_ADMIN_SECRET: ${OPENIM_ADMIN_SECRET:?OPENIM_ADMIN_SECRET is required}
      OPENIM_ADMIN_USER_ID: ${OPENIM_ADMIN_USER_ID:-imAdmin}
      OPENIM_PLATFORM_ID: ${OPENIM_PLATFORM_ID:-5}
      OPENIM_HTTP_TIMEOUT: ${OPENIM_HTTP_TIMEOUT:-10s}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [openim]

  openim-server:
    image: ${OPENIM_SERVER_IMAGE:?OPENIM_SERVER_IMAGE is required}
    init: true
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      etcd: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      IMENV_MONGODB_ADDRESS: ${MONGO_ADDRESS:?MONGO_ADDRESS is required}
      IMENV_MONGODB_USERNAME: ${MONGO_USERNAME:?MONGO_USERNAME is required}
      IMENV_MONGODB_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      IMENV_KAFKA_ADDRESS: ${KAFKA_ADDRESS:?KAFKA_ADDRESS is required}
      IMENV_DISCOVERY_ETCD_ADDRESS: ${ETCD_ADDRESS:?ETCD_ADDRESS is required}
      IMENV_REDIS_ADDRESS: ${REDIS_ADDRESS:?REDIS_ADDRESS is required}
      IMENV_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      IMENV_MINIO_INTERNALADDRESS: ${MINIO_INTERNAL_ADDRESS:?MINIO_INTERNAL_ADDRESS is required}
      IMENV_MINIO_EXTERNALADDRESS: ${MINIO_EXTERNAL_ADDRESS:?MINIO_EXTERNAL_ADDRESS is required}
      IMENV_MINIO_ACCESSKEYID: ${MINIO_ACCESS_KEY_ID:?MINIO_ACCESS_KEY_ID is required}
      IMENV_MINIO_SECRETACCESSKEY: ${MINIO_SECRET_ACCESS_KEY:?MINIO_SECRET_ACCESS_KEY is required}
      IMENV_SHARE_SECRET: ${OPENIM_SECRET:?OPENIM_SECRET is required}
      IMENV_LOG_ISSTDOUT: ${LOG_IS_STDOUT:-true}
      IMENV_LOG_REMAINLOGLEVEL: ${LOG_LEVEL:-6}
    ports:
      - "127.0.0.1:${OPENIM_MSG_GATEWAY_PORT:-10001}:10001"
      - "127.0.0.1:${OPENIM_API_PORT:-10002}:10002"
    healthcheck:
      test: ["CMD-SHELL", "mage check"]
      interval: 15s
      timeout: 60s
      retries: 10
      start_period: 45s
    networks: [openim]

  openim-chat:
    image: ${OPENIM_CHAT_IMAGE:?OPENIM_CHAT_IMAGE is required}
    init: true
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      etcd: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
      openim-server: { condition: service_healthy }
    environment:
      CHATENV_MONGODB_ADDRESS: ${MONGO_ADDRESS:?MONGO_ADDRESS is required}
      CHATENV_MONGODB_USERNAME: ${MONGO_USERNAME:?MONGO_USERNAME is required}
      CHATENV_MONGODB_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      CHATENV_DISCOVERY_ETCD_ADDRESS: ${ETCD_ADDRESS:?ETCD_ADDRESS is required}
      CHATENV_REDIS_ADDRESS: ${REDIS_ADDRESS:?REDIS_ADDRESS is required}
      CHATENV_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      CHATENV_SHARE_OPENIM_SECRET: ${OPENIM_SECRET:?OPENIM_SECRET is required}
      CHATENV_SHARE_OPENIM_APIURL: ${OPENIM_API_URL:?OPENIM_API_URL is required}
      CHATENV_LOG_ISSTDOUT: ${LOG_IS_STDOUT:-true}
      CHATENV_LOG_REMAINLOGLEVEL: ${LOG_LEVEL:-6}
    ports:
      - "127.0.0.1:${OPENIM_CHAT_API_PORT:-10008}:10008"
      - "127.0.0.1:${OPENIM_ADMIN_API_PORT:-10009}:10009"
    healthcheck:
      test: ["CMD-SHELL", "mage check"]
      interval: 15s
      timeout: 60s
      retries: 10
      start_period: 45s
    networks: [openim]

  livekit:
    image: livekit/livekit-server:v1.13.1
    restart: unless-stopped
    command:
      - --config
      - /livekit.yaml
      - --bind
      - 0.0.0.0
      - --node-ip=${LIVEKIT_NODE_IP:?LIVEKIT_NODE_IP is required}
    volumes:
      - ../livekit/livekit.yaml:/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      # WebRTC media candidates must be reachable on the host LAN interface.
      - "7881:7881"
      - "7882:7882/udp"
    networks: [openim]

networks:
  openim:
    driver: bridge

volumes:
  mongo_data:
  mongo_logs:
  redis_data:
  etcd_data:
  kafka_data:
  minio_data:
  postgres_data:
